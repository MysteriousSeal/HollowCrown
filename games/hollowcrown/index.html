<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollowcrown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f2c9a8; }
      #app { width: 100%; height: 100%; display: block; }

      /* The HUD (the engine's UI kit, features/hud.ts): cream Fredoka on dark ink, hard shadows, a sand keycap.
         Nothing in it takes the mouse; it keeps to the edges so the scene stays in view. */
      .ui-overlay {
        --cream: #f8ecd4;
        --ink: #2e1f14;
        --sand: #efdcb8;
        --muted: #c9b8a0;
        --panel: rgba(38, 26, 17, 0.9);
        font-family: 'Fredoka', system-ui, sans-serif;
        color: var(--cream);
      }
      .ui-overlay [hidden] { display: none !important; }
      /* The engine's debug overlay (development only, bottom left) kept out from under a screen. */
      body:has(.ui-talk:not([hidden]), .ui-map:not([hidden]), .ui-journal:not([hidden]), .ui-menu:not([hidden]), .ui-end:not([hidden])) > div[style*="z-index: 1000"] { display: none !important; } /* (over its own inline display) */

      /* A region's name as the hero comes into it: across the top, fading in and out. */
      .ui-banner {
        position: absolute;
        top: 16%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
        opacity: 0;
        transition: opacity 0.8s;
        white-space: nowrap;
      }
      .ui-banner.shown { opacity: 1; }
      .ui-banner-title { font-size: 44px; font-weight: 700; letter-spacing: 0.12em; }
      .ui-banner-sub { font-size: 18px; font-weight: 600; color: var(--muted); }

      /* A small label in a corner (the place nearby, the clock). */
      .ui-label {
        position: absolute;
        padding: 5px 12px 6px;
        font-size: 16px;
        font-weight: 600;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        white-space: nowrap;
      }
      .ui-top-left { top: 16px; left: 18px; }
      .ui-top-right { top: 16px; right: 18px; }
      .ui-bottom-left { bottom: 16px; left: 18px; }
      .ui-bottom-right { bottom: 16px; right: 18px; }

      /* The quest followed, top right under the clock: its name in gold capitals, its stage small, what to do now. */
      .ui-tracker {
        position: absolute;
        top: 62px;
        right: 18px;
        width: 270px;
        box-sizing: border-box;
        padding: 8px 12px 9px;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
      }
      .ui-tracker-title { display: block; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #e8c27a; text-shadow: 0 1px 0 #1e140d; }
      .ui-tracker-sub { display: block; margin-top: 1px; font-size: 12px; font-weight: 600; color: var(--muted); }
      .ui-tracker-line { margin: 5px 0 0; font-size: 15px; font-weight: 500; line-height: 1.3; }
      .ui-tracker-line::before { content: '◆'; margin-right: 6px; font-size: 10px; color: #e8903a; vertical-align: 2px; }

      /* Notices, on the left under the place's name: each slides in from the edge, then out. */
      .ui-toasts { position: absolute; top: 62px; left: 18px; width: 280px; display: flex; flex-direction: column; gap: 8px; }
      .ui-toast {
        padding: 6px 12px 7px;
        background: var(--panel);
        border: 2px solid var(--sand);
        border-left: 4px solid #e8903a;
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        opacity: 0;
        transform: translateX(-24px);
        transition: opacity 0.3s, transform 0.3s ease-out;
      }
      .ui-toast.shown { opacity: 1; transform: none; }
      .ui-toast.leaving { opacity: 0; transform: translateX(-24px); }
      .ui-toast-title { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #e8c27a; }
      .ui-toast-text { display: block; margin-top: 2px; font-size: 15px; font-weight: 500; line-height: 1.3; }

      /* Villagers' names over their heads: cream on an ink outline, no panel, faded by distance. */
      .ui-world-label {
        position: absolute;
        top: 0;
        left: 0;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 0 2px 3px rgba(20, 13, 9, 0.6);
        will-change: transform, opacity;
      }

      /* A meter: dark trough, the fill on it, the share just lost lingering pale behind before it drains. */
      .ui-meter {
        position: absolute;
        height: 18px;
        box-sizing: border-box;
        background: rgba(20, 13, 9, 0.85);
        border: 2px solid var(--ink);
        box-shadow: 0 0 0 2px var(--sand), 3px 3px 0 2px rgba(46, 31, 20, 0.5);
        overflow: hidden;
      }
      .ui-meter i { position: absolute; inset: 0 auto 0 0; }
      .ui-meter-trail { background: #f8ecd4; transition: width 0.5s ease-in 0.45s; }
      .ui-meter-fill { background: #c8402e; box-shadow: inset 0 -4px 0 #8e2418, inset 0 3px 0 #e8705a; transition: width 0.12s; }
      .ui-meter-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--cream); text-shadow: 1px 1px 0 var(--ink); font-variant-numeric: tabular-nums; }
      /* The hero's health, bottom left (over the debug overlay in development). Low: it pulses. */
      .ui-hero-health { left: 20px; bottom: 152px; width: 240px; height: 22px; }
      .ui-hero-health.low .ui-meter-fill { animation: ui-pulse 0.9s ease-in-out infinite alternate; }
      @keyframes ui-pulse { to { filter: brightness(1.45); } }

      /* A hurt foe's health over its head: a short red bar in a dark trough, filled to --share. */
      .ui-world-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 46px;
        height: 7px;
        background: linear-gradient(90deg, #c8402e calc(var(--share, 1) * 100%), rgba(20, 13, 9, 0.85) 0);
        border: 2px solid var(--ink);
        box-shadow: 0 0 0 1px rgba(239, 220, 184, 0.6);
        will-change: transform, opacity;
      }

      /* Damage dealt, floating up from the blow: bold cream with an ink edge; the hero's own hurt in red. */
      .ui-float {
        position: absolute;
        top: 0;
        left: 0;
        font-size: 22px;
        font-weight: 700;
        color: var(--cream);
        text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
        will-change: transform, opacity;
      }
      .ui-float-hurt { color: #ff6a4a; }

      /* What a villager says in passing: a small cream bubble over them, its tail pointing down at them. */
      .ui-bubble {
        position: absolute;
        top: 0;
        left: 0;
        max-width: 220px;
        width: max-content;
        padding: 5px 10px 6px;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
        text-align: center;
        color: var(--ink);
        background: var(--cream);
        border: 2px solid var(--ink);
        border-radius: 8px;
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.45);
        will-change: transform, opacity;
      }
      .ui-bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--ink); border-bottom: 0; }

      /* What E would do: a keycap, then the action, low in the middle. */
      .ui-prompt {
        position: absolute;
        bottom: 22%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 6px;
        font-size: 17px;
        font-weight: 700;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        white-space: nowrap;
      }
      .ui-key {
        min-width: 26px;
        height: 26px;
        padding: 0 5px;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        font: 700 15px/1 'Fredoka', system-ui, sans-serif;
        color: var(--ink);
        background: #ffd98a;
        border: 2px solid var(--ink);
        box-shadow: inset 0 -3px 0 #e8903a;
      }

      /* A dialogue: the speaker's name in gold, one line at a time, low on the screen. */
      .ui-dialogue {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 12px 18px 10px;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
      }
      .ui-dialogue-speaker { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #e8c27a; }
      .ui-dialogue-line { margin: 6px 0 8px; font-size: 18px; font-weight: 500; line-height: 1.35; }
      .ui-dialogue-hint { display: block; text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); }

      /* A conversation (Conversation in the UI kit): the scene dimmed, the hero's portrait left and the other's right,
         a name plate under each, the lines in a gilded panel between them. A click anywhere goes on. */
      .ui-talk {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 560px) minmax(0, 1fr);
        align-items: end;
        gap: 24px;
        padding: 0 4vw 6vh;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 60%, rgba(20, 13, 9, 0.25), rgba(20, 13, 9, 0.62));
        pointer-events: auto;
        cursor: pointer;
        animation: ui-fade-in 0.35s ease-out;
      }
      @keyframes ui-fade-in { from { opacity: 0; } }
      .ui-talk-side { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; transition: filter 0.25s, transform 0.25s, opacity 0.25s; }
      /* The one speaking stands forward, lit; the other steps back into the dark. */
      .ui-talk-side.speaking { transform: translateY(-6px) scale(1.03); }
      .ui-talk-side.speaking .ui-talk-frame { border-color: #e8c27a; box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.6), 0 0 28px rgba(232, 160, 80, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55); }
      .ui-talk-side.listening { filter: brightness(0.45) saturate(0.6); transform: scale(0.95); }
      /* The panel's speaker name sits toward the side speaking. */
      .ui-talk[data-speaker='right'] .ui-talk-speaker { text-align: right; }
      .ui-talk-side.absent { visibility: hidden; } /* no one there (a choice to oneself) */
      .ui-talk-frame {
        height: min(450px, calc(100vh - 230px));
        max-width: 100%;
        aspect-ratio: 2 / 3;
        display: grid;
        place-items: end center;
        overflow: hidden;
        background: radial-gradient(120% 80% at 50% 30%, rgba(232, 194, 122, 0.16), transparent 70%), linear-gradient(180deg, #30201a, #1c130d);
        border: 2px solid #b98a46;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-talk-frame > canvas, .ui-talk-frame > img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .ui-talk-plate {
        padding: 4px 16px 5px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e8c27a;
        background: var(--panel);
        border: 2px solid #b98a46;
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        text-shadow: 0 1px 0 #1e140d;
        white-space: nowrap;
      }
      .ui-talk-panel {
        align-self: end;
        margin-bottom: 44px;
        padding: 14px 20px 10px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(48, 32, 22, 0.95), rgba(28, 19, 13, 0.96));
        border: 2px solid #b98a46;
        border-radius: 4px;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-talk-speaker { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #e8c27a; }
      .ui-talk-text { flex: 1; margin: 8px 0 10px; font-size: 19px; font-weight: 500; line-height: 1.4; }
      /* Replies to pick, numbered, lit under the pointer. */
      .ui-talk-choices { margin: 0 0 8px; padding: 0 0 0 26px; display: flex; flex-direction: column; gap: 4px; }
      .ui-talk-choice { padding: 3px 8px; font-size: 17px; font-weight: 600; color: var(--sand); border: 1px solid transparent; }
      .ui-talk-choice::marker { color: #e8c27a; font-weight: 700; }
      .ui-talk-choice:hover { color: var(--cream); background: rgba(232, 194, 122, 0.12); border-color: rgba(232, 194, 122, 0.45); }
      /* The map (M): the scene dimmed, a gilded frame round the Vale drawn small, the region's name over it. */
      .ui-map {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 13, 9, 0.6);
        pointer-events: auto;
        animation: ui-fade-in 0.25s ease-out;
      }
      .ui-map-panel {
        width: min(92vw, 1100px);
        height: min(86vh, 820px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px 10px;
        background: linear-gradient(180deg, rgba(48, 32, 22, 0.96), rgba(28, 19, 13, 0.97));
        border: 2px solid #b98a46;
        border-radius: 4px;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-map-title { min-height: 1.2em; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: #e8c27a; text-shadow: 0 1px 0 #1e140d; }
      .ui-map-canvas { flex: 1; min-height: 0; width: 100%; display: block; border: 2px solid #1e140d; box-shadow: 0 0 0 1px rgba(232, 194, 122, 0.35); cursor: zoom-in; }
      .ui-map-hint { text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); white-space: pre; }
      /* The pause menu (Esc): the scene dimmed, a narrow gilded panel, its title between fading rules, its choices
         lit under the pointer or the arrows; the Controls page each key on its cap and what it does. */
      .ui-menu {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 13, 9, 0.55);
        pointer-events: auto;
        animation: ui-fade-in 0.2s ease-out;
      }
      .ui-menu-panel {
        width: 360px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px 20px 20px;
        background: linear-gradient(180deg, rgba(48, 32, 22, 0.96), rgba(28, 19, 13, 0.97));
        border: 2px solid #b98a46;
        border-radius: 4px;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-menu-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #e8c27a; text-shadow: 0 1px 0 #1e140d; }
      .ui-menu-title::before, .ui-menu-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(232, 194, 122, 0.7)); }
      .ui-menu-title::after { background: linear-gradient(90deg, rgba(232, 194, 122, 0.7), transparent); }
      .ui-menu-body { display: flex; flex-direction: column; gap: 6px; }
      .ui-menu-item {
        padding: 8px 12px;
        font: 600 17px 'Fredoka', system-ui, sans-serif;
        color: var(--sand);
        background: rgba(20, 13, 9, 0.5);
        border: 2px solid rgba(232, 194, 122, 0.25);
        cursor: pointer;
      }
      .ui-menu-item { white-space: pre-line; line-height: 1.25; }
      .ui-menu-note { margin: 0 0 4px; font-size: 15px; color: var(--muted); }
      .ui-menu-item.lit { color: var(--ink); background: #ffd98a; border-color: var(--ink); box-shadow: inset 0 -3px 0 #e8903a; }
      .ui-menu-rows { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px 12px; margin: 2px 0 8px; }
      .ui-menu-rows .ui-key { justify-self: start; }
      .ui-menu-row-text { margin: 0; font-size: 16px; font-weight: 500; }
      /* The journal (J): a gilded book, the quests down the left (the open one lit), its page on the right: the title
         in gold, the stage, the objectives (done ones struck through and faded), the passage once it's over. */
      .ui-journal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 13, 9, 0.6); pointer-events: auto; animation: ui-fade-in 0.25s ease-out; }
      .ui-journal-book {
        width: min(92vw, 860px);
        height: min(80vh, 600px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 20px 12px;
        background: linear-gradient(180deg, rgba(48, 32, 22, 0.96), rgba(28, 19, 13, 0.97));
        border: 2px solid #b98a46;
        border-radius: 4px;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-journal-head { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #e8c27a; }
      .ui-journal-head::before, .ui-journal-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(232, 194, 122, 0.7)); }
      .ui-journal-head::after { background: linear-gradient(90deg, rgba(232, 194, 122, 0.7), transparent); }
      .ui-journal-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(160px, 1fr) 2fr; gap: 18px; }
      .ui-journal-list { margin: 0; padding: 0 12px 0 0; list-style: none; overflow-y: auto; border-right: 1px solid rgba(232, 194, 122, 0.3); }
      .ui-journal-entry { padding: 6px 10px; font-size: 16px; font-weight: 600; color: var(--sand); border: 2px solid transparent; cursor: pointer; }
      .ui-journal-entry.finished { color: var(--muted); }
      .ui-journal-entry.lit { color: var(--ink); background: #ffd98a; border-color: var(--ink); box-shadow: inset 0 -3px 0 #e8903a; }
      .ui-journal-page { overflow-y: auto; padding-right: 6px; }
      .ui-journal-title { display: block; font-size: 22px; font-weight: 700; color: #e8c27a; text-shadow: 0 1px 0 #1e140d; }
      .ui-journal-sub { display: block; margin-top: 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .ui-journal-items { margin: 12px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
      .ui-journal-item { position: relative; padding-left: 18px; font-size: 16px; font-weight: 500; line-height: 1.35; }
      .ui-journal-item::before { content: '◆'; position: absolute; left: 0; top: 4px; font-size: 10px; color: #e8903a; }
      .ui-journal-item.optional { font-style: italic; }
      .ui-journal-item.done { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(201, 184, 160, 0.7); }
      .ui-journal-item.done::before { color: var(--muted); }
      .ui-journal-text { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid rgba(232, 194, 122, 0.3); font-size: 16px; line-height: 1.45; font-style: italic; color: var(--cream); }
      .ui-journal-hint { text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); }
      /* The death screen: the scene sinking into red-black, "You died" large and wide-spaced, a line under it, the
         choices rising in after a beat. */
      .ui-end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: radial-gradient(ellipse at 50% 45%, rgba(60, 10, 6, 0.55), rgba(8, 4, 3, 0.92) 70%);
        pointer-events: auto;
        animation: ui-fade-in 1.2s ease-in;
      }
      .ui-end-title { font-size: 64px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #c8402e; text-shadow: 3px 3px 0 #1e140d, 0 0 30px rgba(200, 64, 46, 0.45); animation: ui-fade-in 2s ease-in; }
      .ui-end-sub { font-size: 18px; font-weight: 500; font-style: italic; color: var(--muted); }
      .ui-end-choices { margin-top: 26px; display: flex; flex-direction: column; gap: 8px; width: 300px; animation: ui-fade-in 0.6s ease-out; }
      .ui-end-choice { padding: 9px 14px; font: 600 17px 'Fredoka', system-ui, sans-serif; color: var(--sand); background: rgba(20, 13, 9, 0.7); border: 2px solid rgba(232, 194, 122, 0.3); cursor: pointer; }
      .ui-end-choice.lit { color: var(--ink); background: #ffd98a; border-color: var(--ink); box-shadow: inset 0 -3px 0 #e8903a; }
      /* A slider on a menu page: its label, a sand track with an ember fill and a keycap thumb, its value. */
      .ui-menu-slider { display: grid; grid-template-columns: auto 1fr 2.2em; align-items: center; gap: 10px; margin: 4px 0 8px; font-size: 16px; font-weight: 600; }
      .ui-slider-value { text-align: right; font-variant-numeric: tabular-nums; color: var(--sand); }
      .ui-slider { appearance: none; height: 10px; margin: 0; background: rgba(20, 13, 9, 0.8); border: 2px solid var(--ink); box-shadow: 0 0 0 1px rgba(232, 194, 122, 0.35); accent-color: #e8903a; cursor: pointer; }
