<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollowcrown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f2c9a8; }
      #app { width: 100%; height: 100%; display: block; }

      /* The HUD (the engine's UI kit, features/hud.ts): cream Fredoka on dark ink, hard shadows, a sand keycap.
         Nothing in it takes the mouse; it keeps to the edges so the scene stays in view. */
      .ui-overlay {
        --cream: #f8ecd4;
        --ink: #2e1f14;
        --sand: #efdcb8;
        --muted: #c9b8a0;
        --panel: rgba(38, 26, 17, 0.9);
        font-family: 'Fredoka', system-ui, sans-serif;
        color: var(--cream);
      }
      .ui-overlay [hidden] { display: none !important; }

      /* A region's name as the hero comes into it: across the top, fading in and out. */
      .ui-banner {
        position: absolute;
        top: 16%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
        opacity: 0;
        transition: opacity 0.8s;
        white-space: nowrap;
      }
      .ui-banner.shown { opacity: 1; }
      .ui-banner-title { font-size: 44px; font-weight: 700; letter-spacing: 0.12em; }
      .ui-banner-sub { font-size: 18px; font-weight: 600; color: var(--muted); }

      /* A small label in a corner (the place nearby, the clock). */
      .ui-label {
        position: absolute;
        padding: 5px 12px 6px;
        font-size: 16px;
        font-weight: 600;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        white-space: nowrap;
      }
      .ui-top-left { top: 16px; left: 18px; }
      .ui-top-right { top: 16px; right: 18px; }
      .ui-bottom-left { bottom: 16px; left: 18px; }
      .ui-bottom-right { bottom: 16px; right: 18px; }

      /* What E would do: a keycap, then the action, low in the middle. */
      .ui-prompt {
        position: absolute;
        bottom: 22%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 6px;
        font-size: 17px;
        font-weight: 700;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        white-space: nowrap;
      }
      .ui-key {
        min-width: 26px;
        height: 26px;
        padding: 0 5px;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        font: 700 15px/1 'Fredoka', system-ui, sans-serif;
        color: var(--ink);
        background: #ffd98a;
        border: 2px solid var(--ink);
        box-shadow: inset 0 -3px 0 #e8903a;
      }

      /* A dialogue: the speaker's name in gold, one line at a time, low on the screen. */
      .ui-dialogue {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 12px 18px 10px;
        background: var(--panel);
        border: 2px solid var(--sand);
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
      }
      .ui-dialogue-speaker { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #e8c27a; }
      .ui-dialogue-line { margin: 6px 0 8px; font-size: 18px; font-weight: 500; line-height: 1.35; }
      .ui-dialogue-hint { display: block; text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); }

      /* A conversation (Conversation in the UI kit): the scene dimmed, the hero's portrait left and the other's right,
         a name plate under each, the lines in a gilded panel between them. A click anywhere goes on. */
      .ui-talk {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 560px) minmax(0, 1fr);
        align-items: end;
        gap: 24px;
        padding: 0 4vw 6vh;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 60%, rgba(20, 13, 9, 0.55), rgba(20, 13, 9, 0.82));
        pointer-events: auto;
        cursor: pointer;
        animation: ui-fade-in 0.35s ease-out;
      }
      @keyframes ui-fade-in { from { opacity: 0; } }
      .ui-talk-side { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; transition: filter 0.25s, transform 0.25s, opacity 0.25s; }
      /* The one speaking stands forward, lit; the other steps back into the dark. */
      .ui-talk-side.speaking { transform: translateY(-6px) scale(1.03); }
      .ui-talk-side.speaking .ui-talk-frame { border-color: #e8c27a; box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.6), 0 0 28px rgba(232, 160, 80, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55); }
      .ui-talk-side.listening { filter: brightness(0.45) saturate(0.6); transform: scale(0.95); }
      /* The panel's speaker name sits toward the side speaking. */
      .ui-talk[data-speaker='right'] .ui-talk-speaker { text-align: right; }
      .ui-talk-frame {
        width: min(100%, 300px);
        aspect-ratio: 2 / 3;
        display: grid;
        place-items: end center;
        overflow: hidden;
        background: radial-gradient(120% 80% at 50% 30%, rgba(232, 194, 122, 0.16), transparent 70%), linear-gradient(180deg, rgba(48, 32, 22, 0.92), rgba(28, 19, 13, 0.95));
        border: 2px solid #b98a46;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-talk-frame > canvas, .ui-talk-frame > img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .ui-talk-plate {
        padding: 4px 16px 5px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e8c27a;
        background: var(--panel);
        border: 2px solid #b98a46;
        box-shadow: 3px 3px 0 rgba(46, 31, 20, 0.5);
        text-shadow: 0 1px 0 #1e140d;
        white-space: nowrap;
      }
      .ui-talk-panel {
        align-self: end;
        margin-bottom: 44px;
        padding: 14px 20px 10px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(48, 32, 22, 0.95), rgba(28, 19, 13, 0.96));
        border: 2px solid #b98a46;
        border-radius: 4px;
        box-shadow: inset 0 0 0 3px #1e140d, inset 0 0 0 4px rgba(232, 194, 122, 0.35), 0 12px 32px rgba(10, 6, 4, 0.55);
      }
      .ui-talk-speaker { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #e8c27a; }
      .ui-talk-text { flex: 1; margin: 8px 0 10px; font-size: 19px; font-weight: 500; line-height: 1.4; }
      .ui-talk-hint { text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
